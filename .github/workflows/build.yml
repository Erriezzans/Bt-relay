name: Build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BtRelay-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  midlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build JAR/JAD
        run: bash midlet/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BtRelay-midlet
          path: |
            midlet/dist/BtRelay.jar
            midlet/dist/BtRelay.jad
  symbian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install ensymble
          ensymble py2sis --appname=BtRelay --caps=LocalServices+NetworkServices symbian/btrelay.py BtRelay.sis
      - uses: actions/upload-artifact@v4
        with:
          name: BtRelay-sis
          path: BtRelay.sis
